# Nom de projet figé : sans lui, Compose le déduit du nom du dossier. Ce dossier
# ayant déjà bougé une fois, un renommage suffirait à créer de NOUVEAUX volumes
# vides — donc une base et des uploads qui paraîtraient perdus.
name: myplaylog

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Pas de port exposé sur l'hôte : la base n'est joignable que par les
    # autres conteneurs via le réseau interne Docker.
    networks:
      - myplaylog

  # Générateur de « preuve d'origine » (PO token) pour yt-dlp. Depuis l'IP d'un
  # datacenter, YouTube répond « Sign in to confirm you're not a bot » à une
  # requête sur deux — c'est ce qui cassait la lecture des OST. Ce service
  # fabrique le jeton qu'un vrai navigateur produirait, sans compte Google ni
  # cookie à entretenir. Il ne parle qu'au serveur, sur le réseau interne.
  potoken:
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: unless-stopped
    # Le conteneur lance un runtime JS : sans init, ses processus fils zombies
    # s'accumulent (c'est la recommandation de l'image elle-même).
    init: true
    networks:
      - myplaylog

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # On force ces valeurs en prod (elles priment sur le .env s'il diffère).
      MONGODB_URI: mongodb://mongo:27017/myplaylog
      CLIENT_ORIGIN: https://myplaylog.cc
      PORT: 4000
      # Adresse du générateur de PO token (cf. le service `potoken` ci-dessus).
      # 4416 est le port par défaut de l'image.
      POT_PROVIDER_URL: http://potoken:4416
    volumes:
      # Les images uploadées (covers, avatars, reposts…) persistent hors conteneur.
      - uploads_data:/app/uploads
      # Cache des flux audio extraits (OST) : survit aux redéploiements pour ne
      # pas re-télécharger les pistes déjà écoutées.
      - audio_cache:/app/cache
      # Le .env de l'hôte est monté dans le conteneur → l'onglet Secrets du panel
      # Admin peut le LIRE et l'ÉCRIRE (les modifs persistent sur l'hôte).
      # Écritures en place (writeFileSync) → l'inode ne change pas, le mount tient.
      # Rappel : les valeurs lues au démarrage nécessitent un restart du conteneur.
      - ./server/.env:/app/.env
    depends_on:
      - mongo
      - potoken
    networks:
      - myplaylog

  # ====================================================================
  #  coturn — le relais des appels vocaux, en dernier recours
  # ====================================================================
  # La voix va normalement d'un navigateur à l'autre. Ce service n'existe que
  # pour les cas où AUCUN chemin direct n'est possible (réseau d'entreprise,
  # 4G, hôtel, pare-feu qui bloque l'UDP sortant) : sans lui, l'appel a l'air
  # établi et reste silencieux.
  #
  # ------------------------------------------------ pourquoi `network_mode: host`
  # C'EST LA SEULE CONFIGURATION QUI MARCHE SIMPLEMENT. Un relais annonce aux
  # navigateurs l'adresse et le port par lesquels le joindre ; derrière la
  # traduction d'adresses de Docker, il annonce une adresse interne que personne
  # ne peut atteindre, ou il faudrait publier cent ports un par un. En réseau
  # hôte, il voit l'IP publique du VPS directement et tout fonctionne.
  #
  # Conséquence assumée : ce conteneur n'est pas isolé du réseau de la machine.
  # C'est précisément pour ça que `turnserver.conf` interdit explicitement toutes
  # les plages d'adresses privées — sans quoi le relais deviendrait un moyen de
  # parler aux services internes du VPS depuis l'extérieur.
  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    env_file:
      - ./server/.env
    # LE SECRET PASSE EN ARGUMENT, pas par un gabarit de fichier. La première
    # version substituait des ${...} avec `envsubst` — qui n'existe pas dans
    # l'image Alpine de coturn, donc le conteneur n'aurait jamais démarré.
    # Les options de la ligne de commande complètent le fichier de configuration,
    # ce qui garde le secret hors du dépôt sans outil supplémentaire.
    #
    # Le `$$` est une échappée de Compose : il produit un `$` littéral, pour que
    # la variable soit lue par le shell DU CONTENEUR (qui a le .env) et non par
    # Compose sur la machine de déploiement (qui ne l'a pas).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # ⚠️ PAS DE SECRET, PAS DE RELAIS. Sans `TURN_SECRET`, coturn démarrerait
        # SANS authentification, c'est-à-dire en relais ouvert : quelques jours
        # plus tard, des inconnus font passer leur trafic par le VPS et son IP
        # se retrouve sur des listes noires. Mieux vaut un service qui refuse de
        # démarrer en disant pourquoi.
        if [ -z "$$TURN_SECRET" ]; then
          echo "coturn: TURN_SECRET absent de server/.env — le relais NE DÉMARRE PAS."
          echo "coturn: genere-le avec  openssl rand -hex 32  puis relance la pile."
          # On patiente plutôt que de sortir en boucle : `restart: unless-stopped`
          # relancerait le conteneur toutes les secondes et noierait les journaux
          # de la pile entière sous le même message.
          sleep 3600
          exit 1
        fi
        # ⚠️ ON LUI IMPOSE UNE SEULE ADRESSE, et c'est important.
        #
        # Laissé libre, coturn prend TOUTES les interfaces de la machine : l'IP
        # publique, mais aussi les ponts Docker (172.x), Tailscale (100.x), la
        # boucle locale. Il distribue ensuite les relais en alternance entre
        # elles — donc la plupart du temps il annonce au navigateur une adresse
        # que personne ne peut joindre. Le relais semble fonctionner et échoue
        # sept fois sur huit, ce qui est bien pire qu'une panne franche.
        #
        # Les trois options vont ensemble :
        #   listening-ip  où il écoute
        #   relay-ip      par où il fait transiter
        #   external-ip   ce qu'il ANNONCE aux navigateurs
        #
        # Sans TURN_PUBLIC_IP, on laisse coturn se débrouiller : ça marche sur
        # une machine à une seule interface, et un démarrage réussi vaut mieux
        # qu'un refus si quelqu'un déploie ailleurs.
        BIND=""
        if [ -n "$$TURN_PUBLIC_IP" ]; then
          BIND="--listening-ip=$$TURN_PUBLIC_IP --relay-ip=$$TURN_PUBLIC_IP --external-ip=$$TURN_PUBLIC_IP"
        else
          echo "coturn: TURN_PUBLIC_IP absent — coturn ecoutera sur TOUTES les interfaces"
          echo "coturn: (ponts Docker compris), ce qui rend le relais peu fiable."
        fi
        exec turnserver -c /etc/coturn/turnserver.conf \
          --static-auth-secret="$$TURN_SECRET" \
          --realm="$${TURN_REALM:-myplaylog.cc}" \
          $$BIND

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificats HTTPS persistés pour ne pas les regénérer à chaque rebuild.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    networks:
      - myplaylog

volumes:
  mongo_data:
  uploads_data:
  audio_cache:
  caddy_data:
  caddy_config:

networks:
  myplaylog:
