# ======================================================================
#  coturn — le relais de dernier recours des appels vocaux
# ======================================================================
# À QUOI IL SERT, ET QUAND. La voix va normalement d'un navigateur à l'autre,
# sans passer par le serveur (cf. client/src/lib/voiceCall.js). Mais deux
# machines ne se trouvent pas toujours : réseau d'entreprise, 4G, hôtel, pare-feu
# qui interdit l'UDP sortant, ou simplement un navigateur qui refuse d'exposer
# ses adresses locales. Dans ces cas-là, il n'y a AUCUN chemin direct, et sans
# relais l'appel est silencieux — tout a l'air branché, rien ne circule.
#
# Il n'est utilisé QU'EN DERNIER RECOURS : le navigateur essaie d'abord le
# direct, et ne bascule sur le relais que si rien d'autre ne marche. C'est ce qui
# rend le coût tenable (voir plus bas).
#
# ------------------------------------------------------- ce que ça consomme
# Rien en calcul : coturn ne décode pas l'audio, il recopie des paquets. ~40 Mo
# de RAM, quelques pourcents d'un cœur.
#
# La bande passante, elle, est le vrai poste : le relais REÇOIT un flux puis le
# RENVOIE. Un flux Opus fait ~55 kbps, donc un appel à deux entièrement relayé
# coûte ~100 Mo par heure. Un appel de groupe à six, si tout passe par le relais,
# monte à ~1,5 Go/heure — c'est la limite du maillage, pas du relais.

# ----------------------------------------------------------------------
#  Les ports
# ----------------------------------------------------------------------
# UDP ET TCP sur le même port. L'UDP est le chemin normal (la latence en
# dépend) ; le TCP est là pour les réseaux qui interdisent l'UDP sortant, cas
# fréquent en entreprise. Le navigateur essaie les deux et garde ce qui marche.
listening-port=3478

# PAS D'ÉCOUTEUR TLS pour l'instant, et c'est délibéré : il exige un certificat,
# or les nôtres appartiennent à Caddy. Un écouteur TLS sans certificat démarre
# en erreur à chaque lancement et pollue les journaux pour rien.
#
# Ce qu'on perd : les réseaux qui inspectent le trafic et ne laissent sortir que
# du TLS sur 443. C'est une minorité — le TCP sur 3478 couvre déjà l'essentiel
# des réseaux fermés. POUR L'AJOUTER plus tard, monter le volume `caddy_data`
# en lecture seule dans ce conteneur et pointer `cert` / `pkey` vers
# /data/caddy/certificates/…/myplaylog.cc/myplaylog.cc.crt (et .key), puis
# décommenter :
# tls-listening-port=5349
# cert=/data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/myplaylog.cc/myplaylog.cc.crt
# pkey=/data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/myplaylog.cc/myplaylog.cc.key

# La plage de ports de relais. UN PORT PAR FLUX RELAYÉ : cette plage plafonne
# donc le nombre de flux simultanés qui passent par le relais. 100 ports est
# large pour un site de cette taille, et chaque port ouvert est une ligne de
# pare-feu à ouvrir — inutile d'en demander mille.
min-port=49160
max-port=49260

# ----------------------------------------------------------------------
#  L'authentification : éphémère, jamais statique
# ----------------------------------------------------------------------
# PAS DE MOT DE PASSE FIXE. Un TURN ouvert (ou avec un mot de passe qui traîne
# dans le code du client, ce qui revient au même) devient en quelques jours un
# relais gratuit pour n'importe qui — on paie la bande passante d'inconnus, et
# l'adresse du serveur finit sur des listes noires.
#
# Ici, le serveur de l'app FABRIQUE un identifiant valable douze heures, signé
# avec le secret ci-dessous, et ne le donne qu'aux comptes connectés (voir
# server/src/routes/ice.js). coturn revérifie la signature lui-même : il n'a
# besoin d'aucune base d'utilisateurs, et un identifiant qui fuite expire seul.
# Le secret, le domaine et l'adresse publique NE SONT PAS DANS CE FICHIER : il
# est versionné, un secret n'y a pas sa place. Ils sont passés en arguments au
# démarrage, depuis le même `server/.env` que le reste (voir docker-compose.yml)
# — un seul endroit où poser un secret vaut mieux que deux qui divergent.
use-auth-secret

# ----------------------------------------------------------------------
#  Ce qu'on interdit
# ----------------------------------------------------------------------
# ⚠️ LA PARTIE LA PLUS IMPORTANTE DU FICHIER.
#
# Un relais accepte de transmettre vers l'adresse qu'on lui demande. Sans les
# règles ci-dessous, n'importe quel compte pourrait s'en servir pour parler aux
# services INTERNES du VPS — la base Mongo, l'API sur son port privé, les
# métadonnées du fournisseur de cloud — depuis l'intérieur du réseau, en
# contournant tout pare-feu. C'est un classique de l'exfiltration.
#
# On interdit donc toutes les plages privées et locales, et on n'autorise que
# l'Internet public.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Pas de multicast, pas d'ancien protocole, pas de console d'administration
# ouverte : trois portes dont on n'a aucun usage.
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Un garde-fou de débit PAR SESSION, en OCTETS par seconde. 128 000 o/s ≈ 1 Mbit/s,
# là où la voix tient dans 7 000 : le plafond est confortable pour un appel et
# ferme la porte à une session détournée pour relayer une vidéo ou un
# téléchargement sur la bande passante du VPS.
max-bps=128000

# Le nombre d'allocations simultanées — une par flux relayé. Calé sur la plage de
# ports plus haut : en demander davantage ne créerait que des refus tardifs et
# incompréhensibles, puisqu'il n'y aurait plus de port libre de toute façon.
total-quota=100
# Et par personne : six, soit la taille maximale d'un appel. Sans cette limite,
# un seul compte pourrait consommer les cent allocations à lui seul.
user-quota=6

# Journal sur la sortie standard : il part dans les logs Docker avec le reste,
# plutôt que dans un fichier qu'on n'ira jamais lire dans le conteneur.
log-file=stdout
simple-log
