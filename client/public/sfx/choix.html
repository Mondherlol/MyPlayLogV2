<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choix des bruitages</title>
<style>
:root { --bg:#111114; --surface:#1b1b20; --border:#2c2c32; --text:#f2f2f3; --soft:#9d9da5; --acc:#f2b70b; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 "Segoe UI", system-ui, sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 24px 16px 120px; }
h1 { margin: 0 0 4px; font-size: 26px; }
.lead { margin: 0 0 22px; color: var(--soft); }
section { padding: 14px 16px 16px; margin-bottom: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }
section h2 { margin: 0; font-size: 17px; display:flex; align-items:center; gap:10px; }
section h2 .pick { margin-left:auto; font-size:12px; font-weight:700; color:var(--soft); }
section h2 .pick.on { color:var(--acc); }
section p { margin: 2px 0 12px; color: var(--soft); font-size: 13px; }
.opts { display:flex; flex-wrap:wrap; gap:8px; }
button { font: inherit; color: inherit; cursor: pointer; }
.o { display:inline-flex; align-items:center; gap:8px; padding:8px 12px 8px 8px; border-radius:12px; border:1px solid var(--border); background:#141418; transition: border-color .15s, background .15s; }
.o:hover { border-color:#4a4a52; }
.o .pl { width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:#26262c; flex:none; }
.o .pl svg { width:12px; height:12px; fill: currentColor; }
.o.playing .pl { background: var(--acc); color:#161618; }
.o small { color: var(--soft); }
.o.sel { border-color: var(--acc); background: rgba(242,183,11,.08); }
.o.silence .pl { font-size: 13px; }
.bar { position: fixed; left:0; right:0; bottom:0; padding: 12px 16px; background: rgba(17,17,20,.96); border-top: 1px solid var(--border); display:flex; gap:12px; align-items:center; justify-content:center; }
.bar b { color: var(--acc); }
.go { padding: 10px 18px; border-radius: 12px; border: 0; background: var(--acc); color:#161618; font-weight: 800; }
.done { color: var(--soft); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Choix des bruitages</h1>
  <p class="lead">Clique un son pour l'écouter et le choisir. « Silence » si aucun ne te plaît. Tes choix restent enregistrés sur cette page ; quand tu as fini, copie-les et colle-les-moi.</p>
  <div id="list"></div>
</main>
<div class="bar"><span id="count"></span><button class="go" id="copy">Copier mes choix</button><span class="done" id="done"></span></div>

const KEY = "mpl_sfx_choices";
let choices = {};
try { choices = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(choices)); } catch (e) {} };
const PLAY = '<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>';
let audio = null, playingBtn = null;
function play(url, btn) {
  if (audio) { audio.pause(); }
  if (playingBtn) playingBtn.classList.remove("playing");
  if (!url) return;
  audio = new Audio(url);
  playingBtn = btn; btn.classList.add("playing");
  audio.addEventListener("ended", () => btn.classList.remove("playing"));
  audio.play().catch(() => btn.classList.remove("playing"));
}
function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  for (const ev of EVENTS) {
    const sec = document.createElement("section");
    const cur = choices[ev.key];
    const curTitle = cur === "silence" ? "Silence" : (ev.options.find(o => o.id === cur) || {}).title;
    sec.innerHTML = `<h2>${ev.title}<span class="pick ${cur ? "on" : ""}">${cur ? "✓ " + curTitle : "à choisir"}</span></h2><p>${ev.hint}</p><div class="opts"></div>`;
    const opts = sec.querySelector(".opts");
    for (const o of ev.options) {
      const b = document.createElement("button");
      b.className = "o" + (cur === o.id ? " sel" : "");
      b.innerHTML = `<span class="pl">${PLAY}</span><span>${o.title} <small>${o.dur}</small></span>`;
      b.onclick = () => { choices[ev.key] = o.id; save(); play(o.url, b); refresh(sec, ev); };
      opts.appendChild(b);
    }
    const s = document.createElement("button");
    s.className = "o silence" + (cur === "silence" ? " sel" : "");
    s.innerHTML = `<span class="pl">∅</span><span>Silence</span>`;
    s.onclick = () => { choices[ev.key] = "silence"; save(); play(null, s); refresh(sec, ev); };
    opts.appendChild(s);
    list.appendChild(sec);
  }
  count();
}
function refresh(sec, ev) {
  const cur = choices[ev.key];
  const btns = sec.querySelectorAll(".o");
  ev.options.forEach((o, i) => btns[i].classList.toggle("sel", cur === o.id));
  btns[btns.length - 1].classList.toggle("sel", cur === "silence");
  const pick = sec.querySelector(".pick");
  pick.textContent = cur ? "✓ " + (cur === "silence" ? "Silence" : ev.options.find(o => o.id === cur).title) : "à choisir";
  pick.classList.toggle("on", !!cur);
  count();
}
function count() {
  const n = EVENTS.filter(e => choices[e.key]).length;
  document.getElementById("count").innerHTML = `<b>${n}</b> / ${EVENTS.length} choisis`;
}
document.getElementById("copy").onclick = async () => {
  const text = "Mes bruitages : " + EVENTS.map(e => `${e.key}=${choices[e.key] || "?"}`).join(", ");
  try { await navigator.clipboard.writeText(text); document.getElementById("done").textContent = "Copié !"; }
  catch (e) { prompt("Copie ce texte :", text); }
};
render();
</script>
